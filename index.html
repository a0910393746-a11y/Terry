<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>國營試煉 Online｜多人新手村</title><style>
*{box-sizing:border-box}body{margin:0;background:#101524;color:#f8e9bf;font-family:system-ui,-apple-system,sans-serif}main{max-width:680px;margin:auto;padding:16px 12px 35px}h1{font-size:25px;margin:8px 0}small,.muted{color:#adb7ce}.panel{background:#202b43;border:2px solid #51617c;border-radius:12px;padding:13px;margin:12px 0}input,button{font:inherit;border-radius:9px;padding:12px}input{background:#0e182b;color:white;border:1px solid #7183a4;width:100%;margin:5px 0 12px}button{background:#f0bc58;color:#252036;font-weight:800;border:0;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.4}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}#game{width:100%;height:auto;display:block;image-rendering:pixelated;background:#427e4b;border:3px solid #a8a0a0;border-radius:8px}#controls{display:grid;grid-template-columns:repeat(3,58px);justify-content:center;gap:5px;margin:10px auto}#controls button{height:48px;padding:0;background:#56698b;color:white}#controls button:nth-child(1){grid-column:2}#controls button:nth-child(2){grid-column:1;grid-row:2}#controls button:nth-child(3){grid-column:2;grid-row:2}#controls button:nth-child(4){grid-column:3;grid-row:2}.hide{display:none!important}#choices button{display:block;width:100%;text-align:left;margin:7px 0;background:#e5eaf5}#log{font-size:13px;line-height:1.8;min-height:45px}#status{font-size:13px}#error{color:#ffb1b1}</style></head><body><main><h1>⚔️ 國營試煉 Online</h1><div class="muted">多人共用地圖 · 手機雙人驗收版 V0.2</div><section id="entry" class="panel"><label>冒險者暱稱</label><input id="name" maxlength="12" value="冒險者"><label>房間代碼（兩支手機輸入相同代碼）</label><input id="room" maxlength="8" value="START"><button id="join">進入新手村</button><p id="error"></p></section><section id="play" class="hide"><div class="panel"><div id="status">正在連線...</div><canvas id="game" width="480" height="312"></canvas><div id="controls"><button data-dx="0" data-dy="-1">▲</button><button data-dx="-1" data-dy="0">◀</button><button data-dx="0" data-dy="1">▼</button><button data-dx="1" data-dy="0">▶</button></div><div class="row"><button id="fight">⚔️ 答題攻擊 Boss</button><button id="copy">複製邀請網址</button></div><small>使用方向鍵移動；邀請朋友加入同一房間。每次答對可造成 100 傷害。</small></div><div class="panel"><b>🐉 共同 Boss：<span id="boss">600/600</span></b><div id="log"></div></div><div id="quiz" class="panel hide"><h3 id="question"></h3><div id="choices"></div><p id="feedback"></p><button id="again" class="hide">再挑戰一題</button></div></section><p class="muted" style="font-size:12px">測試原型：不收集真實姓名、不提供正式上榜能力認證。免費伺服器可能休眠，初次連線需等待。</p></main><script>
'use strict';const $=id=>document.getElementById(id);let ws=null,myId=null,players=[],room='START',boss=600,answering=false;const cv=$('game'),ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;const size=24;
function tile(x,y,color){ctx.fillStyle=color;ctx.fillRect(x*size,y*size,size,size)}
function draw(){ctx.fillStyle='#447e4b';ctx.fillRect(0,0,480,312);for(let y=0;y<13;y++)for(let x=0;x<20;x++){tile(x,y,(x+y)%5===0?'#4b8c53':'#427f4b');if((x*13+y*17)%29===0){ctx.fillStyle='#a1bd69';ctx.fillRect(x*size+5,y*size+7,4,4)}}for(let y=0;y<13;y++){tile(9,y,'#bbac7b');tile(10,y,'#cbb889')}for(let y=4;y<=7;y++)for(let x=12;x<=15;x++)tile(x,y,'#796b64');ctx.fillStyle='#5e304a';ctx.fillRect(12*size,4*size,96,14);ctx.fillStyle='#ffce72';ctx.fillRect(13*size+6,5*size,12,12);ctx.fillStyle='#ffce72';ctx.fillRect(14*size+6,5*size,12,12);ctx.font='bold 13px monospace';ctx.fillStyle='#fff2cc';ctx.fillText('BOSS',12*size+24,4*size-8);players.forEach(p=>{let x=p.x*size,y=p.y*size;ctx.fillStyle=p.id===myId?'#ffdf64':'#8dd5ff';ctx.fillRect(x+6,y+4,12,16);ctx.fillStyle='#283047';ctx.fillRect(x+8,y+7,3,3);ctx.fillRect(x+14,y+7,3,3);ctx.fillStyle='#ffffff';ctx.font='11px sans-serif';ctx.textAlign='center';ctx.fillText(p.name,x+12,y-3)});ctx.textAlign='left'}draw();
function send(d){if(ws&&ws.readyState===1)ws.send(JSON.stringify(d))}
function join(){if(ws)ws.close();room=$('room').value.trim().toUpperCase()||'START';const name=$('name').value.trim()||'冒險者';$('error').textContent='';ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');ws.onopen=()=>send({type:'join',name,room});ws.onmessage=e=>{const d=JSON.parse(e.data);if(d.type==='joined'){myId=d.id;$('entry').classList.add('hide');$('play').classList.remove('hide');$('status').textContent='房間 '+d.room+'｜已連線'}if(d.type==='state'){players=d.players;boss=d.boss;$('status').textContent='房間 '+room+'｜在線 '+players.length+' 人｜我的 XP '+(players.find(p=>p.id===myId)?.xp??0);$('boss').textContent=d.boss+'/'+d.max_boss+'（第 '+(d.round+1)+' 輪）';$('log').textContent=d.log.join('　·　');draw()}if(d.type==='question'){answering=true;$('quiz').classList.remove('hide');$('feedback').textContent='';$('again').classList.add('hide');$('question').textContent=d.text;$('choices').innerHTML='';d.options.forEach((t,i)=>{const b=document.createElement('button');b.textContent='ABC'[i]+'. '+t;b.onclick=()=>{if(!answering)return;answering=false;send({type:'answer',choice:i});$('choices').querySelectorAll('button').forEach(b=>b.disabled=true)};$('choices').appendChild(b)});$('quiz').scrollIntoView({behavior:'smooth',block:'nearest'})}if(d.type==='result'){$('feedback').textContent=(d.correct?'✅ 答對！':'❌ 答錯。')+' '+d.explanation;$('again').classList.remove('hide')}if(d.type==='error'){$('error').textContent=d.message}};ws.onclose=()=>{$('status').textContent='連線中斷，請重新整理頁面';$('error').textContent='連線已中斷'};ws.onerror=()=>{$('error').textContent='連線失敗，請確認網站伺服器是否已啟動'}}
$('join').onclick=join;$('fight').onclick=()=>{send({type:'question'})};$('again').onclick=()=>send({type:'question'});document.querySelectorAll('[data-dx]').forEach(b=>b.onclick=()=>send({type:'move',dx:Number(b.dataset.dx),dy:Number(b.dataset.dy)}));$('copy').onclick=async()=>{const url=location.origin+'/?room='+encodeURIComponent(room);try{await navigator.clipboard.writeText(url);alert('已複製邀請網址')}catch(e){prompt('請複製此網址',url)}};const r=new URLSearchParams(location.search).get('room');if(r)$('room').value=r;
</script></body></html>
